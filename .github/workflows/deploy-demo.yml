name: Deploy Demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'ngx-event-hub-demo/**'
      - 'ngx-event-hub-lib/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install library dependencies
        working-directory: ./ngx-event-hub-lib
        run: npm ci

      - name: Build library
        working-directory: ./ngx-event-hub-lib
        run: npm run build

      - name: Install demo dependencies
        working-directory: ./ngx-event-hub-demo
        run: npm ci

      - name: Build demo app for GitHub Pages
        working-directory: ./ngx-event-hub-demo
        run: npm run build -- --configuration production --base-href /ngx-event-hub/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './ngx-event-hub-demo/dist/ngx-event-hub-demo/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

