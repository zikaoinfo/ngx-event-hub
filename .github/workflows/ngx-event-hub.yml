# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: ngx-event-hub publish to npm

on:
  push:
    branches: [ "main" ]
    paths:
      - 'ngx-event-hub-lib/**'
      - '.github/workflows/ngx-event-hub.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'ngx-event-hub-lib/**'
      - '.github/workflows/ngx-event-hub.yml'
jobs:
  build-release:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ngx-event-hub-lib/package-lock.json
    - name: Install lib Dependencies
      working-directory: ./ngx-event-hub-lib
      run: |
        npm ci || (rm -rf node_modules package-lock.json && npm install)
    - name: build lib
      working-directory: ./ngx-event-hub-lib
      run: npm run build
    - name: Set npm registry
      run: npm config set registry https://registry.npmjs.org/

    - name: publish lib
      working-directory: ./ngx-event-hub-lib/dist/ngx-event-hub
      run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{secrets.NPM_AUTH_TOKEN}}
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
