<div class="card code-example-card">
  <div class="card-header">
    <div>
      <div class="card-title">💻 {{ example.title }}</div>
      <p class="card-description">{{ example.description }}</p>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button 
      class="tab-button" 
      [class.active]="activeTab === 'html'"
      (click)="setTab('html')"
    >
      HTML
    </button>
    <button 
      class="tab-button" 
      [class.active]="activeTab === 'js'"
      (click)="setTab('js')"
    >
      TypeScript
    </button>
    <button 
      class="tab-button" 
      [class.active]="activeTab === 'preview'"
      (click)="setTab('preview')"
    >
      Preview
    </button>
  </div>

  <!-- Tab Content -->
  <div class="tab-content">
    <!-- HTML Tab -->
    <div class="code-block" *ngIf="activeTab === 'html'">
      <div class="code-header">
        <span class="code-label">HTML Template</span>
        <button class="copy-button" (click)="copyToClipboard(example.html)" title="Copy code">
          {{ copied ? '✓ Copied' : '📋 Copy' }}
        </button>
      </div>
      <pre><code class="html">{{ example.html }}</code></pre>
    </div>

    <!-- TypeScript Tab -->
    <div class="code-block" *ngIf="activeTab === 'js'">
      <div class="code-header">
        <span class="code-label">TypeScript</span>
        <button class="copy-button" (click)="copyToClipboard(example.ts)" title="Copy code">
          {{ copied ? '✓ Copied' : '📋 Copy' }}
        </button>
      </div>
      <pre><code class="typescript">{{ example.ts }}</code></pre>
    </div>

    <!-- Preview Tab -->
    <div class="preview-block" *ngIf="activeTab === 'preview'">
      <div class="code-header">
        <span class="code-label">Live Preview</span>
      </div>
      <div class="preview-content">
        <ng-container #previewContainer></ng-container>
      </div>
    </div>
  </div>
</div>
